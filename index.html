<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#111016">
  <title>Filtro Bailey 5 anos</title>
  <style>
    :root{color-scheme:dark;--pink:#f3a5c7;--blue:#a7d8ff;--app-h:100dvh;--ui-gap:8px}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111016;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    button{font:inherit}
    #app{position:fixed;left:0;top:0;width:100%;height:var(--app-h);display:grid;place-items:center;overflow:hidden;background:#111016}
    #stage{position:relative;width:min(100vw,calc(var(--app-h)*.5625));height:min(177.7778vw,var(--app-h));overflow:hidden;background:#08080a}
    #camera,#photoResult,#videoResult,#fxCanvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    #camera{z-index:1;transform:scaleX(-1)}
    #camera.rear{transform:none}
    #fxCanvas{z-index:3;pointer-events:none}
    #photoResult,#videoResult{display:none;z-index:20;background:#08080a}
    #frame{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:5;pointer-events:none}
    #sparkles{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
    .dust{position:absolute;border-radius:50%;background:rgba(255,255,255,.58);box-shadow:0 0 1px rgba(255,255,255,.18);opacity:.03;animation:dustGlow var(--d) ease-in-out infinite;animation-delay:var(--delay)}
    @keyframes dustGlow{0%,100%{opacity:.015;transform:scale(.55)}50%{opacity:.14;transform:scale(1)}}
    #topbar{position:absolute;z-index:12;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 10px 0;display:flex;justify-content:space-between;pointer-events:none}
    .round{pointer-events:auto;width:42px;height:42px;border:1px solid #ffffff55;border-radius:50%;background:#15131bc9;color:#fff;font-size:19px;display:grid;place-items:center;backdrop-filter:blur(8px)}
    #controls{position:absolute;z-index:12;left:8px;right:8px;bottom:var(--ui-gap);padding:7px 7px max(7px,env(safe-area-inset-bottom));border-radius:22px;background:rgba(10,9,14,.78);box-shadow:0 8px 30px #0008;backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:6px}
    #modes{align-self:center;display:flex;padding:2px;background:#ffffff13;border-radius:999px;border:1px solid #ffffff28}
    .mode{border:0;background:transparent;color:#ffffffa8;font-size:11px;font-weight:850;border-radius:999px;padding:4px 16px}
    .mode.active{background:#fff;color:#25212a}
    #filters{display:flex;justify-content:center;gap:5px}
    .filter{border:1px solid #ffffff4f;background:#17151db5;color:#fff;border-radius:999px;padding:7px 11px;font-weight:780;font-size:11px;white-space:nowrap}
    .filter.active{border-color:#fff;background:linear-gradient(135deg,var(--pink),var(--blue));color:#25202a}
    #actions{height:54px;display:grid;grid-template-columns:1fr 62px 1fr;align-items:center}
    #shot{position:relative;width:54px;height:54px;border-radius:50%;border:4px solid #fff;background:linear-gradient(145deg,var(--pink),var(--blue));box-shadow:0 0 0 2px #0005;justify-self:center}
    #shot.video{background:#ef4f5f}
    #shot.recording::after{content:"";position:absolute;inset:14px;border-radius:4px;background:#fff}
    .labelBtn{border:0;background:transparent;color:#fff;font-weight:750;font-size:10px;line-height:1.15;text-align:center}
    #timer{font-variant-numeric:tabular-nums;color:#fff;font-size:11px;font-weight:800;text-align:center}
    #effectNote{height:12px;text-align:center;color:#ffffffb5;font-size:9px}
    #status{position:absolute;z-index:30;inset:0;display:grid;place-items:center;text-align:center;padding:35px;color:#fff;background:#15131b}
    #status button{border:0;border-radius:999px;padding:12px 20px;background:linear-gradient(135deg,var(--pink),var(--blue));font-weight:800;color:#24202a;margin-top:10px}
    #resultActions{position:absolute;z-index:40;left:10px;right:10px;bottom:max(74px,env(safe-area-inset-bottom));display:none;grid-template-columns:1fr 1fr;gap:9px}
    #resultActions button{border:0;border-radius:999px;padding:12px;font-weight:800;font-size:14px}
    #again{background:#fff;color:#222}#save{background:linear-gradient(135deg,var(--pink),var(--blue));color:#25202a}
    #instagram{grid-column:1/-1;background:linear-gradient(100deg,#833ab4,#fd1d1d,#fcb045);color:#fff}
    .hidden{display:none!important}
  </style>
</head>
<body>
<main id="app"><section id="stage">
  <video id="camera" autoplay playsinline muted></video>
  <canvas id="fxCanvas" width="720" height="1280"></canvas>
  <canvas id="photoResult" width="1152" height="2048"></canvas>
  <video id="videoResult" playsinline controls></video>
  <div id="sparkles"></div>
  <img id="frame" src="moldura.png" alt="Moldura Bailey 5 anos">
  <div id="topbar"><button id="torch" class="round" aria-label="Lanterna">⚡</button><button id="flip" class="round" aria-label="Trocar câmera">↻</button></div>
  <div id="controls">
    <div id="modes"><button class="mode active" data-mode="photo">FOTO</button><button class="mode" data-mode="video">VÍDEO</button></div>
    <div id="filters">
      <button class="filter active" data-filter="natural">Natural</button>
      <button class="filter" data-filter="skin">Pele suave</button>
      <button class="filter" data-filter="makeup">Cílios</button>
    </div>
    <div id="actions"><button id="sparkToggle" class="labelBtn">Pó de luz<br>ligado</button><button id="shot" aria-label="Capturar"></button><span id="timer"></span></div>
    <div id="effectNote"></div>
  </div>
  <div id="resultActions"><button id="again">Fazer outro</button><button id="save">Salvar</button><button id="instagram">Usar no Instagram</button></div>
  <div id="status"><div><strong>Seu filtro está pronto ✨</strong><p>Permita o acesso à câmera para começar.</p><button id="start">Abrir câmera</button></div></div>
</section></main>
<canvas id="recordCanvas" width="720" height="1280" hidden></canvas>
<canvas id="workCanvas" width="720" height="1280" hidden></canvas>
<script type="module">
import {FaceLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs";

const q=s=>document.querySelector(s);
const video=q('#camera'),frame=q('#frame'),stage=q('#stage');
const fx=q('#fxCanvas'),fctx=fx.getContext('2d');
const photo=q('#photoResult'),pctx=photo.getContext('2d',{alpha:false});
const recCanvas=q('#recordCanvas'),rctx=recCanvas.getContext('2d',{alpha:false});
const work=q('#workCanvas'),wctx=work.getContext('2d',{alpha:false});
const videoResult=q('#videoResult'),status=q('#status'),controls=q('#controls'),topbar=q('#topbar');
const resultActions=q('#resultActions'),sparkLayer=q('#sparkles'),shot=q('#shot'),timer=q('#timer'),effectNote=q('#effectNote');
let stream,audioStream,facing='user',selected='natural',mode='photo',sparklesOn=true,torchOn=false;
let recorder,chunks=[],recording=false,recordRaf=0,liveRaf=0,startedAt=0,lastBlob=null,lastKind='photo',resultURL='';
let faceLandmarker=null,lastFace=null,lastDetect=0,trackerFailed=false;

function fitViewport(){
  const h=window.visualViewport?.height||innerHeight;
  document.documentElement.style.setProperty('--app-h',h+'px');
  const isiOS=/iPhone|iPad|iPod/.test(navigator.userAgent)&&!navigator.standalone;
  document.documentElement.style.setProperty('--ui-gap',isiOS?'10px':'8px');
}
fitViewport();addEventListener('resize',fitViewport);window.visualViewport?.addEventListener('resize',fitViewport);

const liveFilters={
  natural:'none',
  skin:'brightness(1.065) contrast(.86) saturate(.97)',
  makeup:'brightness(1.065) contrast(.86) saturate(.97)'
};
const dust=Array.from({length:38},()=>({
  x:.07+Math.random()*.86,y:.09+Math.random()*.73,size:.15+Math.random()*.38,
  phase:Math.random()*Math.PI*2,speed:.001+Math.random()*.002
}));
dust.forEach(p=>{
  const s=document.createElement('i');s.className='dust';
  s.style.cssText=`left:${p.x*100}%;top:${p.y*100}%;width:${p.size}px;height:${p.size}px;--d:${1.6+Math.random()*3}s;--delay:${-Math.random()*4}s`;
  sparkLayer.appendChild(s);
});

async function initTracker(){
  effectNote.textContent='Preparando tratamento facial…';
  try{
    const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm');
    const opts={
      baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'GPU'},
      runningMode:'VIDEO',numFaces:1,minFaceDetectionConfidence:.45,minFacePresenceConfidence:.45,minTrackingConfidence:.45
    };
    try{faceLandmarker=await FaceLandmarker.createFromOptions(vision,opts)}
    catch(e){delete opts.baseOptions.delegate;faceLandmarker=await FaceLandmarker.createFromOptions(vision,opts)}
    effectNote.textContent='';
  }catch(e){trackerFailed=true;effectNote.textContent='Tratamento básico disponível';}
}
initTracker();

async function openCamera(){
  try{
    stream?.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false});
    video.srcObject=stream;video.classList.toggle('rear',facing==='environment');await video.play();setLiveFilter();
    status.classList.add('hidden');q('#torch').style.visibility=facing==='environment'?'visible':'hidden';
    cancelAnimationFrame(liveRaf);liveLoop();
  }catch(e){status.innerHTML='<div><strong>Não consegui abrir a câmera</strong><p>Confira a permissão e abra pelo Safari ou Chrome.</p><button onclick="location.reload()">Tentar novamente</button></div>'}
}
function setLiveFilter(){video.style.filter=liveFilters[selected]}
q('#start').onclick=openCamera;
q('#flip').onclick=async()=>{if(recording)return;facing=facing==='user'?'environment':'user';torchOn=false;lastFace=null;await openCamera()};
q('#torch').onclick=async()=>{
  const track=stream?.getVideoTracks()[0];if(!track)return;
  try{torchOn=!torchOn;await track.applyConstraints({advanced:[{torch:torchOn}]})}
  catch(e){torchOn=false;alert('A lanterna não está disponível neste aparelho.')}
};
q('#sparkToggle').onclick=()=>{sparklesOn=!sparklesOn;sparkLayer.style.display=sparklesOn?'block':'none';q('#sparkToggle').innerHTML=`Pó de luz<br>${sparklesOn?'ligado':'desligado'}`};

document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{
  if(recording)return;q('.filter.active').classList.remove('active');b.classList.add('active');selected=b.dataset.filter;setLiveFilter();
  if(selected==='makeup'&&!faceLandmarker&&!trackerFailed)effectNote.textContent='Preparando cílios…';
  else if(selected==='makeup'&&trackerFailed)effectNote.textContent='Não foi possível carregar os cílios';
  else effectNote.textContent='';
});
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{
  if(recording)return;q('.mode.active').classList.remove('active');b.classList.add('active');mode=b.dataset.mode;
  shot.classList.toggle('video',mode==='video');timer.textContent=mode==='video'?'toque para gravar':'';
});

function coverRect(sw,sh,dw,dh){const scale=Math.max(dw/sw,dh/sh),w=sw*scale,h=sh*scale;return{x:(dw-w)/2,y:(dh-h)/2,w,h,scale}}
function mapPoint(lm,w,h){
  const r=coverRect(video.videoWidth,video.videoHeight,w,h);
  let x=r.x+lm.x*video.videoWidth*r.scale;
  if(facing==='user')x=w-x;
  return{x,y:r.y+lm.y*video.videoHeight*r.scale};
}
function drawCamera(ctx,w,h){
  const r=coverRect(video.videoWidth,video.videoHeight,w,h);ctx.save();ctx.filter=liveFilters[selected];
  if(facing==='user'){ctx.translate(w,0);ctx.scale(-1,1);ctx.drawImage(video,r.x,r.y,r.w,r.h)}
  else ctx.drawImage(video,r.x,r.y,r.w,r.h);
  ctx.restore();
}
function smoothUnderEyes(ctx,w,h,face){
  if(selected==='natural')return;
  work.width=w;work.height=h;wctx.clearRect(0,0,w,h);wctx.drawImage(ctx.canvas,0,0,w,h);
  ctx.save();ctx.globalAlpha=.46;ctx.filter=`blur(${Math.max(3,w/330)}px) brightness(1.025)`;
  const pairs=[[33,133],[362,263]];
  pairs.forEach(([a,b])=>{
    if(!face?.[a]||!face?.[b])return;const p1=mapPoint(face[a],w,h),p2=mapPoint(face[b],w,h);
    const cx=(p1.x+p2.x)/2,cy=(p1.y+p2.y)/2+Math.abs(p2.x-p1.x)*.15,rw=Math.abs(p2.x-p1.x)*.72,rh=rw*.42;
    ctx.save();ctx.beginPath();ctx.ellipse(cx,cy,rw,rh,0,0,Math.PI*2);ctx.clip();ctx.drawImage(work,0,0,w,h);ctx.restore();
  });
  ctx.restore();
}
const LEFT_UP=[33,246,161,160,159,158,157,173,133],RIGHT_UP=[362,398,384,385,386,387,388,466,263];
function strokeCurve(ctx,pts,width,color){
  ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
  pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.restore();
}
function drawMakeup(ctx,w,h,face){
  if(selected!=='makeup'||!face)return;
  const left=LEFT_UP.map(i=>mapPoint(face[i],w,h)),right=RIGHT_UP.map(i=>mapPoint(face[i],w,h));
  const lw=Math.max(1.2,w/420);strokeCurve(ctx,left,lw,'rgba(35,22,24,.78)');strokeCurve(ctx,right,lw,'rgba(35,22,24,.78)');
  [left,right].forEach(eye=>{
    [1,2,3,5,6,7].forEach((idx,j)=>{
      const p=eye[idx],prev=eye[Math.max(0,idx-1)],next=eye[Math.min(eye.length-1,idx+1)];
      let tx=next.x-prev.x,ty=next.y-prev.y,len=Math.hypot(tx,ty)||1,nx=ty/len,ny=-tx/len;
      if(ny>0){nx=-nx;ny=-ny}
      const s=(4.2+(j%3)*1.2)*(w/360);ctx.save();ctx.strokeStyle='rgba(35,22,24,.72)';ctx.lineWidth=Math.max(1,w/520);ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.quadraticCurveTo(p.x+nx*s*.65,p.y+ny*s*.65,p.x+nx*s,p.y+ny*s);ctx.stroke();ctx.restore();
    });
  });
}
function drawLiveTreatment(ctx,w,h,face){
  if(selected==='natural'||!face)return;
  const pairs=[[33,133],[362,263]];
  pairs.forEach(([a,b])=>{
    const p1=mapPoint(face[a],w,h),p2=mapPoint(face[b],w,h);
    const span=Math.abs(p2.x-p1.x),cx=(p1.x+p2.x)/2,cy=(p1.y+p2.y)/2+span*.15,rw=span*.72,rh=rw*.42;
    ctx.save();ctx.beginPath();ctx.ellipse(cx,cy,rw,rh,0,0,Math.PI*2);ctx.clip();
    ctx.globalAlpha=.52;ctx.filter=`blur(${Math.max(3,w/260)}px) brightness(1.035)`;
    const r=coverRect(video.videoWidth,video.videoHeight,w,h);
    if(facing==='user'){ctx.translate(w,0);ctx.scale(-1,1);ctx.drawImage(video,r.x,r.y,r.w,r.h)}
    else ctx.drawImage(video,r.x,r.y,r.w,r.h);
    ctx.restore();
  });
}
function drawDust(ctx,w,h,time){
  if(!sparklesOn)return;
  dust.forEach(p=>{
    const pulse=.5+.5*Math.sin(time*p.speed+p.phase),x=p.x*w,y=p.y*h,s=p.size*(w/360)*(.65+pulse*.55);
    ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=.025+pulse*.10;ctx.fillStyle='rgba(255,255,255,.72)';ctx.shadowColor='#fff';ctx.shadowBlur=s*.5;
    ctx.beginPath();ctx.arc(x,y,s,0,Math.PI*2);ctx.fill();ctx.restore();
  });
}
function compose(ctx,w,h,time=performance.now()){
  ctx.clearRect(0,0,w,h);drawCamera(ctx,w,h);smoothUnderEyes(ctx,w,h,lastFace);drawDust(ctx,w,h,time);drawMakeup(ctx,w,h,lastFace);ctx.drawImage(frame,0,0,w,h);
}
function liveLoop(t=performance.now()){
  if(video.readyState>=2&&faceLandmarker&&t-lastDetect>70){
    try{const res=faceLandmarker.detectForVideo(video,t);lastFace=res.faceLandmarks?.[0]||null;lastDetect=t}catch(e){}
  }
  fctx.clearRect(0,0,fx.width,fx.height);drawLiveTreatment(fctx,fx.width,fx.height,lastFace);drawMakeup(fctx,fx.width,fx.height,lastFace);
  liveRaf=requestAnimationFrame(liveLoop);
}

async function takePhoto(){
  if(!video.videoWidth)return;compose(pctx,photo.width,photo.height);
  lastBlob=await new Promise(resolve=>photo.toBlob(resolve,'image/jpeg',.95));lastKind='photo';showResult('photo');
}
function supportedMime(){return ['video/mp4;codecs=h264,aac','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported?.(t))||''}
async function startRecording(){
  if(!window.MediaRecorder||!recCanvas.captureStream){alert('Atualize o Safari ou Chrome para gravar vídeos.');return}
  chunks=[];try{audioStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false})}catch(e){audioStream=null}
  const composed=recCanvas.captureStream(30);audioStream?.getAudioTracks().forEach(t=>composed.addTrack(t));
  const mime=supportedMime();try{recorder=new MediaRecorder(composed,mime?{mimeType:mime}:undefined)}catch(e){recorder=new MediaRecorder(composed)}
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  recorder.onstop=()=>{
    const type=recorder.mimeType||chunks[0]?.type||'video/mp4';lastBlob=new Blob(chunks,{type});lastKind='video';
    audioStream?.getTracks().forEach(t=>t.stop());cancelAnimationFrame(recordRaf);showResult('video');
  };
  recorder.start(250);recording=true;startedAt=performance.now();shot.classList.add('recording');timer.textContent='00:00';renderRecording();
}
function renderRecording(t=performance.now()){
  if(!recording)return;compose(rctx,recCanvas.width,recCanvas.height,t);
  const secs=Math.floor((t-startedAt)/1000);timer.textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;
  if(secs>=60){stopRecording();return}recordRaf=requestAnimationFrame(renderRecording);
}
function stopRecording(){if(!recording)return;recording=false;shot.classList.remove('recording');recorder?.stop()}
shot.onclick=()=>mode==='photo'?takePhoto():(recording?stopRecording():startRecording());

function showResult(kind){
  controls.style.display='none';topbar.style.display='none';sparkLayer.style.display='none';fx.style.display='none';frame.style.display='none';resultActions.style.display='grid';
  if(kind==='photo')photo.style.display='block';
  else{if(resultURL)URL.revokeObjectURL(resultURL);resultURL=URL.createObjectURL(lastBlob);videoResult.src=resultURL;videoResult.style.display='block';videoResult.play().catch(()=>{})}
  q('#save').textContent=kind==='photo'?'Salvar foto':'Salvar vídeo';
}
q('#again').onclick=()=>{
  photo.style.display='none';videoResult.pause();videoResult.style.display='none';videoResult.removeAttribute('src');
  controls.style.display='flex';topbar.style.display='flex';sparkLayer.style.display=sparklesOn?'block':'none';fx.style.display='block';frame.style.display='block';resultActions.style.display='none';
};
q('#save').onclick=async()=>{
  if(!lastBlob)return;const ext=lastKind==='photo'?'jpg':(lastBlob.type.includes('webm')?'webm':'mp4');
  const file=new File([lastBlob],`bailey-5-anos.${ext}`,{type:lastBlob.type});
  if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:'Bailey 5 anos'});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(lastBlob);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
};
q('#instagram').onclick=async()=>{
  if(!lastBlob)return;const ext=lastKind==='photo'?'jpg':(lastBlob.type.includes('webm')?'webm':'mp4');
  const file=new File([lastBlob],`bailey-5-anos.${ext}`,{type:lastBlob.type});
  if(navigator.canShare?.({files:[file]})){
    try{await navigator.share({files:[file],title:'Usar no Instagram'});return}catch(e){if(e.name==='AbortError')return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(lastBlob);a.download=file.name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  alert('O arquivo foi salvo. Agora abra o Instagram e escolha a foto ou o vídeo na sua galeria.');
};
if(!navigator.mediaDevices?.getUserMedia)status.innerHTML='<div><strong>Navegador incompatível</strong><p>Abra no Safari ou Chrome atualizado.</p></div>';
</script>
</body>
</html>
