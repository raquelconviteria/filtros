<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Câmera com Moldura</title>
  <style>
    :root { color-scheme: dark; --ui: 42px; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    body { position: fixed; inset: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #camera { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    #preview { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #000; }
    #screenFlash { position: fixed; inset: 0; z-index: 7; opacity: 0; pointer-events: none; transition: opacity .12s ease; }
    #screenFlash.on { opacity: 1; box-shadow: inset 0 0 95px 55px rgba(255,255,255,.92); }
    .controls {
      position: fixed; z-index: 10; left: 50%; bottom: max(10px, env(safe-area-inset-bottom));
      transform: translateX(-50%); display: flex; align-items: center; justify-content: center;
      gap: 8px; padding: 6px 9px; border-radius: 24px;
      background: rgba(0,0,0,.28); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      max-width: calc(100vw - 20px);
    }
    button {
      appearance: none; -webkit-appearance: none; width: var(--ui); height: var(--ui); flex: 0 0 var(--ui);
      display: grid; place-items: center; border: 1px solid rgba(255,255,255,.72); border-radius: 50%;
      padding: 0; margin: 0; color: #fff; background: rgba(24,24,24,.56); font: inherit;
      touch-action: manipulation;
    }
    button:active { transform: scale(.94); }
    button:disabled { opacity: .35; }
    button svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    #shutterBtn.recording { color: #ff4545; border-color: #ff6868; animation: pulse 1s infinite; }
    #shutterBtn.recording svg { fill: currentColor; }
    #shutterBtn { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
    #status {
      position: fixed; z-index: 11; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
      max-width: calc(100vw - 28px); padding: 6px 10px; border-radius: 14px; color: #fff;
      background: rgba(0,0,0,.42); font-size: 12px; text-align: center; opacity: 0; transition: opacity .2s;
      pointer-events: none;
    }
    #status.show { opacity: 1; }
    @keyframes pulse { 50% { opacity: .6; } }
  </style>
</head>
<body>
  <video id="camera" autoplay muted playsinline></video>
  <canvas id="preview"></canvas>
  <div id="screenFlash"></div>
  <div id="status" role="status"></div>

  <div class="controls" aria-label="Controles da câmera">
    <button id="flashBtn" type="button" aria-label="Ativar flash" title="Flash">
      <svg viewBox="0 0 24 24"><path d="M13 2 5 14h7l-1 8 8-12h-7z"/></svg>
    </button>
    <button id="shutterBtn" type="button" aria-label="Toque para foto; segure para vídeo" title="Toque: foto • Segure: vídeo">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg>
    </button>
    <button id="switchBtn" type="button" aria-label="Virar câmera" title="Virar câmera">
      <svg viewBox="0 0 24 24"><path d="M20 7h-4l-2-2h-4L8 7H4v12h16z"/><path d="M15 11a4 4 0 1 0 1 3"/><path d="m16 9-.7 3-3-.7"/></svg>
    </button>
  </div>

  <script>
    (() => {
      'use strict';
      const video = document.querySelector('#camera');
      const canvas = document.querySelector('#preview');
      const ctx = canvas.getContext('2d', { alpha: false });
      const frame = new Image();
      frame.src = 'moldura.png';

      const flashBtn = document.querySelector('#flashBtn');
      const shutterBtn = document.querySelector('#shutterBtn');
      const switchBtn = document.querySelector('#switchBtn');
      const screenFlash = document.querySelector('#screenFlash');
      const status = document.querySelector('#status');

      let stream, recorder, chunks = [], animationId;
      let facingMode = 'user';
      let flashOn = false;
      let recording = false;
      let holdTimer = null;
      let holdingToRecord = false;
      let statusTimer;

      const showStatus = (message, ms = 2200) => {
        clearTimeout(statusTimer);
        status.textContent = message;
        status.classList.add('show');
        statusTimer = setTimeout(() => status.classList.remove('show'), ms);
      };

      const resize = () => {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(innerWidth * dpr);
        canvas.height = Math.round(innerHeight * dpr);
      };

      function coverRect(sw, sh, dw, dh) {
        const scale = Math.max(dw / sw, dh / sh);
        const w = sw * scale, h = sh * scale;
        return [(dw - w) / 2, (dh - h) / 2, w, h];
      }

      function drawMirrored(source, rect, w) {
        const [x, y, dw, dh] = rect;
        if (facingMode === 'user') {
          ctx.save();
          ctx.translate(w, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(source, x, y, dw, dh);
          ctx.restore();
        } else {
          ctx.drawImage(source, x, y, dw, dh);
        }
      }

      function drawSparkles(w, h, time) {
        // Opacidade 5%: brilho mínimo, apenas um “tcham”.
        ctx.save();
        ctx.globalAlpha = 0.15;
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = Math.max(1, w / 500);
        ctx.shadowColor = '#fff';
        ctx.shadowBlur = Math.max(2, w / 180);
        const points = [[.13,.21],[.81,.17],[.72,.39],[.22,.56],[.88,.68],[.38,.78],[.62,.88]];
        points.forEach(([px, py], i) => {
          const r = (2.2 + .65 * Math.sin(time / 850 + i)) * Math.max(1, w / 500);
          const x = px * w, y = py * h;
          ctx.beginPath();
          ctx.moveTo(x - r * 2.2, y); ctx.lineTo(x + r * 2.2, y);
          ctx.moveTo(x, y - r * 2.2); ctx.lineTo(x, y + r * 2.2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(x, y, Math.max(.8, r * .55), 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      }

      function render(time = 0) {
        const w = canvas.width, h = canvas.height;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);
        if (video.readyState >= 2 && video.videoWidth) {
          const fullRect = coverRect(video.videoWidth, video.videoHeight, w, h);
          ctx.save();
          // Suavização neutra e leve: não altera o tom natural da pele.
          ctx.filter = 'contrast(0.99) saturate(1.01) brightness(1.005)';
          drawMirrored(video, fullRect, w);
          ctx.restore();
          drawSparkles(w, h, time);
          if (frame.complete && frame.naturalWidth) ctx.drawImage(frame, 0, 0, w, h);
        }
        animationId = requestAnimationFrame(render);
      }

      async function stopStream() {
        if (stream) stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      async function startCamera() {
        if (!navigator.mediaDevices?.getUserMedia) {
          showStatus('Abra em um navegador compatível com câmera.', 5000);
          return;
        }
        await stopStream();
        flashOn = false;
        flashBtn.classList.remove('active');
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: facingMode }, width: { ideal: 1080 }, height: { ideal: 1920 } },
            audio: true
          });
        } catch (withAudioError) {
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: { ideal: facingMode }, width: { ideal: 1080 }, height: { ideal: 1920 } },
              audio: false
            });
            showStatus('Microfone não autorizado; o vídeo será gravado sem som.');
          } catch (error) {
            showStatus('Permita o acesso à câmera nas configurações do Safari.', 5000);
            return;
          }
        }
        video.srcObject = stream;
        await video.play();
        const track = stream.getVideoTracks()[0];
        const capabilities = track?.getCapabilities?.();
        if (capabilities?.zoom && typeof capabilities.zoom.min === 'number') {
          try { await track.applyConstraints({ advanced: [{ zoom: capabilities.zoom.min }] }); } catch {}
        }
        updateFlashAvailability();
      }

      function updateFlashAvailability() {
        if (facingMode === 'user') {
          flashBtn.disabled = false;
          flashBtn.title = 'Flash frontal pela tela';
          return;
        }
        const track = stream?.getVideoTracks()[0];
        const torch = !!track?.getCapabilities?.().torch;
        flashBtn.disabled = !torch;
        flashBtn.title = torch ? 'Flash traseiro' : 'Flash traseiro indisponível neste navegador';
        if (!torch) showStatus('O Safari não liberou o flash traseiro neste aparelho.');
      }

      async function toggleFlash() {
        if (facingMode === 'user') {
          flashOn = !flashOn;
          screenFlash.classList.toggle('on', flashOn);
          return;
        }
        const track = stream?.getVideoTracks()[0];
        if (!track?.getCapabilities?.().torch) return;
        flashOn = !flashOn;
        try {
          await track.applyConstraints({ advanced: [{ torch: flashOn }] });
        } catch {
          flashOn = false;
          showStatus('Não foi possível ligar o flash traseiro.');
        }
      }

      async function switchCamera() {
        if (recording) return showStatus('Pare a gravação antes de virar a câmera.');
        screenFlash.classList.remove('on');
        facingMode = facingMode === 'user' ? 'environment' : 'user';
        await startCamera();
      }

      function supportedMimeType() {
        const types = ['video/mp4;codecs=h264,aac', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
        return types.find(type => window.MediaRecorder?.isTypeSupported?.(type)) || '';
      }

      async function startRecording() {
        if (recording) return;
        if (!window.MediaRecorder || !canvas.captureStream) {
          return showStatus('A gravação com moldura não é compatível com esta versão do Safari.', 5000);
        }
        const composed = canvas.captureStream(30);
        const mic = stream?.getAudioTracks()[0];
        if (mic) composed.addTrack(mic);
        chunks = [];
        const mimeType = supportedMimeType();
        try {
          recorder = new MediaRecorder(composed, mimeType ? { mimeType, videoBitsPerSecond: 6000000 } : undefined);
        } catch {
          return showStatus('Não foi possível iniciar a gravação.', 4000);
        }
        recorder.ondataavailable = event => { if (event.data?.size) chunks.push(event.data); };
        recorder.onstop = saveRecording;
        recorder.start(250);
        recording = true;
        shutterBtn.classList.add('recording');
        shutterBtn.setAttribute('aria-label', 'Gravando; solte para parar');
        switchBtn.disabled = true;
        showStatus('Gravando… solte o botão para parar.');
      }

      function stopRecording() {
        if (recording && recorder?.state !== 'inactive') recorder.stop();
      }

      async function takePhoto() {
        if (!stream || video.readyState < 2) return showStatus('A câmera ainda está carregando.');
        if (facingMode === 'user' && flashOn) {
          screenFlash.classList.add('on');
          await new Promise(resolve => setTimeout(resolve, 280));
        }
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.96));
        if (facingMode === 'user') screenFlash.classList.toggle('on', flashOn);
        if (!blob) return showStatus('Não foi possível criar a foto.');
        const file = new File([blob], 'foto-com-moldura.jpg', { type: 'image/jpeg' });
        try {
          if (navigator.share && navigator.canShare?.({ files: [file] })) {
            await navigator.share({ files: [file], title: 'Foto com moldura' });
            showStatus('Foto pronta!');
            return;
          }
        } catch (error) {
          if (error?.name === 'AbortError') return;
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = file.name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 3000);
        showStatus('Foto salva.');
      }

      async function saveRecording() {
        recording = false;
        shutterBtn.classList.remove('recording');
        shutterBtn.setAttribute('aria-label', 'Toque para foto; segure para vídeo');
        switchBtn.disabled = false;
        const type = recorder?.mimeType || chunks[0]?.type || 'video/mp4';
        const extension = type.includes('webm') ? 'webm' : 'mp4';
        const blob = new Blob(chunks, { type });
        const file = new File([blob], `video-com-moldura.${extension}`, { type });
        try {
          if (navigator.share && navigator.canShare?.({ files: [file] })) {
            await navigator.share({ files: [file], title: 'Vídeo com moldura' });
            showStatus('Vídeo pronto!');
            return;
          }
        } catch (error) {
          if (error?.name === 'AbortError') return;
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = file.name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 3000);
        showStatus('Vídeo salvo.');
      }

      function pressShutter(event) {
        event.preventDefault();
        if (event.pointerId != null) shutterBtn.setPointerCapture?.(event.pointerId);
        holdingToRecord = false;
        clearTimeout(holdTimer);
        holdTimer = setTimeout(async () => {
          holdingToRecord = true;
          if (navigator.vibrate) navigator.vibrate(35);
          await startRecording();
        }, 420);
      }

      async function releaseShutter(event) {
        event.preventDefault();
        clearTimeout(holdTimer);
        if (holdingToRecord || recording) {
          stopRecording();
        } else {
          await takePhoto();
        }
        holdingToRecord = false;
      }

      flashBtn.addEventListener('click', toggleFlash);
      switchBtn.addEventListener('click', switchCamera);
      shutterBtn.addEventListener('pointerdown', pressShutter);
      shutterBtn.addEventListener('pointerup', releaseShutter);
      shutterBtn.addEventListener('pointercancel', event => {
        event.preventDefault();
        clearTimeout(holdTimer);
        if (recording) stopRecording();
        holdingToRecord = false;
      });
      shutterBtn.addEventListener('contextmenu', event => event.preventDefault());
      addEventListener('resize', resize, { passive: true });
      addEventListener('orientationchange', () => setTimeout(resize, 180), { passive: true });
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && video.paused) video.play().catch(() => {});
      });

      resize();
      render();
      startCamera();
    })();
  </script>
</body>
</html>
