<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#15131b">
  <title>Filtro Bailey 5 anos</title>
  <style>
    :root{color-scheme:dark;--pink:#ff9bc3;--blue:#7fcfff;--gold:#ffc85a}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15131b;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    #app{position:fixed;inset:0;display:grid;place-items:center;background:#15131b}
    #stage{position:relative;width:min(100vw,56.25vh);height:min(177.7778vw,100vh);overflow:hidden;background:#08080a}
    video,#preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    video{transform:scaleX(-1)}
    video.rear{transform:none}
    #preview{display:none;z-index:8;background:#08080a}
    #frame{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:3;pointer-events:none}
    #sparkles{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
    .spark{position:absolute;width:10px;height:10px;animation:twinkle var(--d) ease-in-out infinite;animation-delay:var(--delay);opacity:0;filter:drop-shadow(0 0 5px currentColor)}
    .spark::before,.spark::after{content:"";position:absolute;background:currentColor;border-radius:999px}
    .spark::before{left:4px;top:0;width:2px;height:10px}.spark::after{left:0;top:4px;width:10px;height:2px}
    @keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}45%,60%{opacity:.95;transform:scale(1) rotate(45deg)}}
    #topbar{position:absolute;z-index:10;left:0;right:0;top:0;padding:max(12px,env(safe-area-inset-top)) 12px 0;display:flex;justify-content:space-between;pointer-events:none}
    .round{pointer-events:auto;width:44px;height:44px;border:1px solid #ffffff55;border-radius:50%;background:#15131bb8;color:#fff;font-size:20px;display:grid;place-items:center;backdrop-filter:blur(8px)}
    #controls{position:absolute;z-index:10;left:0;right:0;bottom:0;padding:12px 12px max(14px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#09080dcc 28%);display:flex;flex-direction:column;gap:12px}
    #filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:24px 2px 0}
    #filters::-webkit-scrollbar{display:none}
    .filter{flex:0 0 auto;border:1px solid #ffffff50;background:#15131bb5;color:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;backdrop-filter:blur(8px)}
    .filter.active{border-color:#fff;background:linear-gradient(135deg,var(--pink),var(--blue));color:#25202a}
    #actions{display:grid;grid-template-columns:1fr 78px 1fr;align-items:center}
    #shot{width:70px;height:70px;border-radius:50%;border:5px solid #fff;background:linear-gradient(145deg,var(--pink),var(--blue));box-shadow:0 0 0 2px #0005;justify-self:center}
    .labelBtn{border:0;background:transparent;color:#fff;font-weight:700;font-size:12px;text-shadow:0 1px 4px #000;text-align:center}
    #status{position:absolute;z-index:20;inset:0;display:grid;place-items:center;text-align:center;padding:35px;color:#fff;background:#15131b}
    #status button{border:0;border-radius:999px;padding:12px 20px;background:linear-gradient(135deg,var(--pink),var(--blue));font-weight:800;color:#24202a;margin-top:10px}
    #resultActions{position:absolute;z-index:15;left:12px;right:12px;bottom:max(16px,env(safe-area-inset-bottom));display:none;grid-template-columns:1fr 1fr;gap:10px}
    #resultActions button{border:0;border-radius:999px;padding:13px;font-weight:800;font-size:15px}
    #again{background:#fff;color:#222}#save{background:linear-gradient(135deg,var(--pink),var(--blue));color:#25202a}
    .hidden{display:none!important}
  </style>
</head>
<body>
<main id="app"><section id="stage">
  <video id="camera" autoplay playsinline muted></video>
  <canvas id="preview" width="1152" height="2048"></canvas>
  <div id="sparkles"></div>
  <img id="frame" src="moldura.png" alt="Moldura Bailey 5 anos">
  <div id="topbar"><button id="torch" class="round" aria-label="Lanterna">⚡</button><button id="flip" class="round" aria-label="Trocar câmera">↻</button></div>
  <div id="controls">
    <div id="filters">
      <button class="filter active" data-filter="natural">Natural</button>
      <button class="filter" data-filter="matte">Matte</button>
      <button class="filter" data-filter="rose">Rosé</button>
      <button class="filter" data-filter="glow">Glow</button>
    </div>
    <div id="actions"><button id="sparkToggle" class="labelBtn">✨ Brilhos<br>ligados</button><button id="shot" aria-label="Tirar foto"></button><span></span></div>
  </div>
  <div id="resultActions"><button id="again">Tirar outra</button><button id="save">Salvar foto</button></div>
  <div id="status"><div><strong>Seu filtro está pronto ✨</strong><p>Permita o acesso à câmera para começar.</p><button id="start">Abrir câmera</button></div></div>
</section></main>
<script>
(() => {
  const video=document.querySelector('#camera'), frame=document.querySelector('#frame');
  const canvas=document.querySelector('#preview'), ctx=canvas.getContext('2d',{alpha:false});
  const status=document.querySelector('#status'), controls=document.querySelector('#controls');
  const topbar=document.querySelector('#topbar'), resultActions=document.querySelector('#resultActions');
  const sparkLayer=document.querySelector('#sparkles');
  let stream, facing='user', selected='natural', sparklesOn=true, torchOn=false, lastBlob=null;
  const filterCSS={natural:'none',matte:'contrast(.88) saturate(.86) brightness(1.08)',rose:'sepia(.12) saturate(1.08) hue-rotate(320deg) brightness(1.04)',glow:'brightness(1.09) contrast(.92) saturate(1.08)'};

  function makeSparkles(){
    const colors=['#ffffff','#ffadd0','#80d7ff','#ffd66e'];
    for(let i=0;i<24;i++){
      const s=document.createElement('i'); s.className='spark';
      s.style.left=(8+Math.random()*84)+'%'; s.style.top=(10+Math.random()*72)+'%';
      s.style.color=colors[i%colors.length]; s.style.setProperty('--d',(1.7+Math.random()*2.2)+'s');
      s.style.setProperty('--delay',(-Math.random()*3)+'s'); sparkLayer.appendChild(s);
    }
  }
  makeSparkles();

  async function openCamera(){
    try{
      if(stream) stream.getTracks().forEach(t=>t.stop());
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false});
      video.srcObject=stream; video.classList.toggle('rear',facing==='environment'); await video.play();
      status.classList.add('hidden'); document.querySelector('#torch').style.visibility=facing==='environment'?'visible':'hidden';
    }catch(e){status.innerHTML='<div><strong>Não consegui abrir a câmera</strong><p>Confira se o navegador tem permissão para usar a câmera e abra o link por HTTPS.</p><button onclick="location.reload()">Tentar novamente</button></div>';}
  }

  function setLiveFilter(){video.style.filter=filterCSS[selected];}
  document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{
    document.querySelector('.filter.active').classList.remove('active'); b.classList.add('active'); selected=b.dataset.filter; setLiveFilter();
  });
  document.querySelector('#start').onclick=openCamera;
  document.querySelector('#flip').onclick=async()=>{facing=facing==='user'?'environment':'user';torchOn=false;await openCamera();};
  document.querySelector('#sparkToggle').onclick=()=>{sparklesOn=!sparklesOn;sparkLayer.style.display=sparklesOn?'block':'none';document.querySelector('#sparkToggle').innerHTML=`✨ Brilhos<br>${sparklesOn?'ligados':'desligados'}`;};
  document.querySelector('#torch').onclick=async()=>{
    const track=stream?.getVideoTracks()[0]; if(!track)return;
    try{torchOn=!torchOn;await track.applyConstraints({advanced:[{torch:torchOn}]});}catch(e){torchOn=false;alert('A lanterna não está disponível neste aparelho.');}
  };

  function coverRect(sw,sh,dw,dh){const scale=Math.max(dw/sw,dh/sh),w=sw*scale,h=sh*scale;return{x:(dw-w)/2,y:(dh-h)/2,w,h};}
  function drawSparkle(x,y,size,color,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=size;ctx.beginPath();ctx.ellipse(x,y,size*.16,size,0,0,Math.PI*2);ctx.ellipse(x,y,size,size*.16,0,0,Math.PI*2);ctx.fill();ctx.restore();}
  function addPhotoSparkles(){
    const pts=[[.29,.23,14],[.72,.28,19],[.46,.34,12],[.62,.45,16],[.34,.53,18],[.76,.58,11],[.49,.66,16],[.24,.7,12],[.68,.74,20]];
    const colors=['#fff','#ffb3d2','#84d8ff','#ffd36e'];pts.forEach((p,i)=>drawSparkle(p[0]*canvas.width,p[1]*canvas.height,p[2],colors[i%4],.92));
  }
  function addMatte(){ctx.save();ctx.globalCompositeOperation='screen';ctx.fillStyle='rgba(244,224,213,.11)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.restore();}
  function addRose(){ctx.save();ctx.globalCompositeOperation='soft-light';ctx.fillStyle='rgba(255,128,178,.18)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.restore();}
  function addGlow(){ctx.save();ctx.globalCompositeOperation='screen';const g=ctx.createRadialGradient(576,770,30,576,770,740);g.addColorStop(0,'rgba(255,255,255,.22)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(0,0,1152,2048);ctx.restore();}

  async function shoot(){
    if(!video.videoWidth)return;
    const r=coverRect(video.videoWidth,video.videoHeight,canvas.width,canvas.height);
    ctx.save();ctx.filter=filterCSS[selected];
    if(facing==='user'){ctx.translate(canvas.width,0);ctx.scale(-1,1);ctx.drawImage(video,r.x,r.y,r.w,r.h);}else ctx.drawImage(video,r.x,r.y,r.w,r.h);
    ctx.restore(); if(selected==='matte')addMatte(); if(selected==='rose')addRose(); if(selected==='glow')addGlow();
    if(sparklesOn)addPhotoSparkles(); ctx.drawImage(frame,0,0,canvas.width,canvas.height);
    lastBlob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.95));
    canvas.style.display='block';controls.style.display='none';topbar.style.display='none';sparkLayer.style.display='none';frame.style.display='none';resultActions.style.display='grid';
  }
  document.querySelector('#shot').onclick=shoot;
  document.querySelector('#again').onclick=()=>{canvas.style.display='none';controls.style.display='flex';topbar.style.display='flex';sparkLayer.style.display=sparklesOn?'block':'none';frame.style.display='block';resultActions.style.display='none';};
  document.querySelector('#save').onclick=async()=>{
    if(!lastBlob)return; const file=new File([lastBlob],'foto-bailey-5-anos.jpg',{type:'image/jpeg'});
    if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:'Bailey 5 anos'});return;}catch(e){if(e.name==='AbortError')return;}}
    const a=document.createElement('a');a.href=URL.createObjectURL(lastBlob);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  };
  if(!navigator.mediaDevices?.getUserMedia)status.innerHTML='<div><strong>Navegador incompatível</strong><p>Abra este link no Chrome ou Safari atualizado.</p></div>';
})();
</script>
</body>
</html>
