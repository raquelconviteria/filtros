<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Câmera com moldura</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow:hidden;background:#000;height:100%;width:100%;position:fixed;inset:0}
#camera-wrap{position:fixed;inset:0;width:100vw;height:100vh;overflow:hidden;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#sparkles,#frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#sparkles{z-index:2}#frame{z-index:3}
#frontFlash{position:fixed;inset:0;z-index:10;opacity:0;pointer-events:none;transition:opacity .15s ease}
#frontFlash.on{opacity:1;box-shadow:inset 0 0 95px 55px rgba(255,255,255,.95)}
#buttons{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:10px;z-index:20;padding:7px 10px;border-radius:28px;background:rgba(0,0,0,.32);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
button{appearance:none;-webkit-appearance:none;width:43px;height:43px;min-width:43px;padding:0;margin:0;display:grid;place-items:center;border:1px solid rgba(255,255,255,.75);border-radius:50%;color:#fff;background:rgba(35,35,35,.62);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button:active{transform:scale(.94)}button:disabled{opacity:.35}button.active{color:#ffe778;border-color:#ffe778}
button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#shutterBtn.recording{color:#ff4545;border-color:#ff6565;animation:pulse 1s infinite}#shutterBtn.recording svg{fill:currentColor}
#status{position:fixed;z-index:30;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);max-width:calc(100vw - 28px);padding:6px 10px;border-radius:14px;color:#fff;background:rgba(0,0,0,.46);font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
#status.show{opacity:1}#download{display:none}@keyframes pulse{50%{opacity:.55}}
</style>
</head>
<body>
<div id="camera-wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="sparkles"></canvas>
  <img id="frame" src="moldura.png" alt="">
</div>
<div id="frontFlash"></div>
<div id="status" role="status"></div>
<div id="buttons">
  <button id="flashBtn" type="button" aria-label="Flash" title="Flash"><svg viewBox="0 0 24 24"><path d="M13 2 5 14h7l-1 8 8-12h-7z"/></svg></button>
  <button id="shutterBtn" type="button" aria-label="Toque para foto; segure para vídeo" title="Toque: foto • Segure: vídeo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg></button>
  <button id="switchBtn" type="button" aria-label="Virar câmera" title="Virar câmera"><svg viewBox="0 0 24 24"><path d="M20 7h-4l-2-2h-4L8 7H4v12h16z"/><path d="M15 11a4 4 0 1 0 1 3"/><path d="m16 9-.7 3-3-.7"/></svg></button>
</div>
<a id="download"></a>
<script>
const video=document.getElementById("video");
const frame=document.getElementById("frame");
const sparkles=document.getElementById("sparkles");
const sparkleCtx=sparkles.getContext("2d");
const shutterBtn=document.getElementById("shutterBtn");
const switchBtn=document.getElementById("switchBtn");
const flashBtn=document.getElementById("flashBtn");
const frontFlash=document.getElementById("frontFlash");
const status=document.getElementById("status");
const download=document.getElementById("download");
const TARGET_W=720,TARGET_H=1280,HOLD_TIME=450,SPARKLE_OPACITY=.20;
let stream=null,usingFront=true,flashOn=false,recorder=null,recording=false,recordCanvas=null,recordAnimation=null,chunks=[],holdTimer=null,longPress=false,statusTimer=null;
const sparklePoints=[[.13,.20],[.82,.17],[.72,.38],[.22,.54],[.88,.67],[.37,.76],[.63,.87],[.49,.29]];

function showStatus(message,duration=2200){clearTimeout(statusTimer);status.textContent=message;status.classList.add("show");statusTimer=setTimeout(()=>status.classList.remove("show"),duration)}
function resizeSparkles(){const dpr=Math.min(devicePixelRatio||1,2);sparkles.width=Math.round(innerWidth*dpr);sparkles.height=Math.round(innerHeight*dpr)}
function drawSparkles(ctx,width,height,time){
  ctx.save();ctx.globalAlpha=SPARKLE_OPACITY;ctx.strokeStyle="#fff";ctx.fillStyle="#fff";ctx.lineWidth=Math.max(1,width/600);ctx.shadowColor="#fff";ctx.shadowBlur=Math.max(2,width/180);
  sparklePoints.forEach(([px,py],index)=>{const x=px*width,y=py*height,pulse=2.3+.75*Math.sin(time/700+index*.9),radius=pulse*Math.max(1,width/720);ctx.beginPath();ctx.moveTo(x-radius*2.2,y);ctx.lineTo(x+radius*2.2,y);ctx.moveTo(x,y-radius*2.2);ctx.lineTo(x,y+radius*2.2);ctx.stroke();ctx.beginPath();ctx.arc(x,y,Math.max(.8,radius*.5),0,Math.PI*2);ctx.fill()});ctx.restore()
}
function animateSparkles(time=0){sparkleCtx.clearRect(0,0,sparkles.width,sparkles.height);drawSparkles(sparkleCtx,sparkles.width,sparkles.height,time);requestAnimationFrame(animateSparkles)}

async function startCamera(){
  if(stream)stream.getTracks().forEach(track=>track.stop());
  flashOn=false;frontFlash.classList.remove("on");flashBtn.classList.remove("active");
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:usingFront?"user":"environment"},audio:true})}
  catch(audioError){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:usingFront?"user":"environment"},audio:false});showStatus("Microfone não autorizado: o vídeo ficará sem som.")}
  catch(cameraError){showStatus("Permita o acesso à câmera no Safari.",5000);return}}
  video.srcObject=stream;video.style.transform=usingFront?"scaleX(-1)":"scaleX(1)";await video.play();await waitForVideoReady();updateFlashButton()
}
function waitForVideoReady(){return new Promise(resolve=>{if(video.readyState>=2&&video.videoWidth>0){resolve();return}video.onloadedmetadata=()=>resolve()})}
function updateFlashButton(){
  if(usingFront){flashBtn.disabled=false;flashBtn.title="Flash frontal pela tela";return}
  const track=stream?.getVideoTracks()[0],hasTorch=Boolean(track?.getCapabilities?.().torch);flashBtn.disabled=!hasTorch;flashBtn.title=hasTorch?"Flash traseiro":"Flash traseiro indisponível";if(!hasTorch)showStatus("O Safari não liberou o flash traseiro neste aparelho.")
}
async function toggleFlash(){
  if(usingFront){flashOn=!flashOn;frontFlash.classList.toggle("on",flashOn);flashBtn.classList.toggle("active",flashOn);return}
  const track=stream?.getVideoTracks()[0];if(!track?.getCapabilities?.().torch)return;flashOn=!flashOn;
  try{await track.applyConstraints({advanced:[{torch:flashOn}]});flashBtn.classList.toggle("active",flashOn)}catch(error){flashOn=false;showStatus("Não foi possível ligar o flash traseiro.")}
}

function cameraCrop(){
  const vw=video.videoWidth,vh=video.videoHeight,videoRatio=vw/vh,targetRatio=TARGET_W/TARGET_H;let sx,sy,sw,sh;
  if(videoRatio>targetRatio){sh=vh;sw=sh*targetRatio;sx=(vw-sw)/2;sy=0}else{sw=vw;sh=sw/targetRatio;sx=0;sy=(vh-sh)/2}
  return{sx,sy,sw,sh}
}
function drawComposition(ctx,time=performance.now()){
  const{sx,sy,sw,sh}=cameraCrop();ctx.clearRect(0,0,TARGET_W,TARGET_H);ctx.save();ctx.filter="contrast(0.99) saturate(1.01) brightness(1.005)";
  if(usingFront){ctx.translate(TARGET_W,0);ctx.scale(-1,1)}
  ctx.drawImage(video,sx,sy,sw,sh,0,0,TARGET_W,TARGET_H);ctx.restore();drawSparkles(ctx,TARGET_W,TARGET_H,time);if(frame.complete&&frame.naturalWidth)ctx.drawImage(frame,0,0,TARGET_W,TARGET_H)
}

async function takePhoto(){
  await waitForVideoReady();if(frame.decode)await frame.decode().catch(()=>{});
  if(usingFront&&flashOn){frontFlash.classList.add("on");await new Promise(resolve=>setTimeout(resolve,250))}
  const canvas=document.createElement("canvas");canvas.width=TARGET_W;canvas.height=TARGET_H;drawComposition(canvas.getContext("2d"));
  download.download="foto-evento.png";download.href=canvas.toDataURL("image/png");download.click();showStatus("Foto tirada e salva!")
}
function supportedMimeType(){const types=["video/mp4;codecs=h264,aac","video/mp4","video/webm;codecs=vp9,opus","video/webm"];return types.find(type=>MediaRecorder?.isTypeSupported?.(type))||""}
async function startRecording(){
  if(recording)return;await waitForVideoReady();
  if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){showStatus("Atualize o Safari para conseguir gravar vídeos.",5000);return}
  recordCanvas=document.createElement("canvas");recordCanvas.width=TARGET_W;recordCanvas.height=TARGET_H;const recordCtx=recordCanvas.getContext("2d");
  const render=time=>{drawComposition(recordCtx,time);recordAnimation=requestAnimationFrame(render)};render(performance.now());
  const composedStream=recordCanvas.captureStream(30),audioTrack=stream?.getAudioTracks()[0];if(audioTrack)composedStream.addTrack(audioTrack);chunks=[];const mimeType=supportedMimeType();
  try{recorder=new MediaRecorder(composedStream,mimeType?{mimeType,videoBitsPerSecond:6000000}:undefined)}catch(error){cancelAnimationFrame(recordAnimation);showStatus("Não foi possível iniciar a gravação.");return}
  recorder.ondataavailable=event=>{if(event.data?.size)chunks.push(event.data)};recorder.onstop=saveVideo;recorder.start(250);recording=true;shutterBtn.classList.add("recording");shutterBtn.setAttribute("aria-label","Gravando; solte para parar");switchBtn.disabled=true;showStatus("Gravando… solte o botão para terminar.")
}
function stopRecording(){if(recording&&recorder?.state!=="inactive")recorder.stop()}
function saveVideo(){
  recording=false;cancelAnimationFrame(recordAnimation);shutterBtn.classList.remove("recording");shutterBtn.setAttribute("aria-label","Toque para foto; segure para vídeo");switchBtn.disabled=false;
  const type=recorder?.mimeType||chunks[0]?.type||"video/mp4",extension=type.includes("webm")?"webm":"mp4",blob=new Blob(chunks,{type}),url=URL.createObjectURL(blob);download.download=`video-evento.${extension}`;download.href=url;download.click();setTimeout(()=>URL.revokeObjectURL(url),4000);showStatus("Vídeo gravado e salvo!")
}
function pressShutter(event){event.preventDefault();if(event.pointerId!=null)shutterBtn.setPointerCapture?.(event.pointerId);longPress=false;clearTimeout(holdTimer);holdTimer=setTimeout(async()=>{longPress=true;if(navigator.vibrate)navigator.vibrate(30);await startRecording()},HOLD_TIME)}
async function releaseShutter(event){event.preventDefault();clearTimeout(holdTimer);if(longPress||recording)stopRecording();else await takePhoto();longPress=false}

switchBtn.addEventListener("click",async()=>{if(recording)return;usingFront=!usingFront;await startCamera()});
flashBtn.addEventListener("click",toggleFlash);
shutterBtn.addEventListener("pointerdown",pressShutter);
shutterBtn.addEventListener("pointerup",releaseShutter);
shutterBtn.addEventListener("pointercancel",event=>{event.preventDefault();clearTimeout(holdTimer);if(recording)stopRecording();longPress=false});
shutterBtn.addEventListener("contextmenu",event=>event.preventDefault());
addEventListener("resize",resizeSparkles,{passive:true});addEventListener("orientationchange",()=>setTimeout(resizeSparkles,180),{passive:true});
resizeSparkles();animateSparkles();startCamera();
</script>
</body>
</html>
